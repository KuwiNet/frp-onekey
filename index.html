<!DOCTYPE html>
<html lang="cn">
<head>
  <meta charset="UTF-8">
  <title>aFrp</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <script>
    let t = 15;
    const countdown = () => {
      const target = document.getElementById('show');
      target.innerHTML = `The URL will auto-redirect in 
        <h1 style="display:inline;color:red">${t}</h1> s → 
        <a href="https://www.afrp.net" style="color:#1cc88a">www.afrp.net</a>`;
      if (t-- <= 0) {
        clearInterval(interval);
        window.location.href = 'https://www.afrp.net';
      }
    }
    const interval = setInterval(countdown, 1000);
  </script>
  <link rel="shortcut icon" href="https://www.afrp.net/assets/img/favicon.ico">
  <style>
    :root { --accent: #F1F1F1; }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      color: #F1F1F1;
      font-family: "Comfortaa Bold V2";
    }
	@font-face {
	    font-family: "Comfortaa Bold V2";
	    src: url("https://db.onlinewebfonts.com/t/70f9644542515286487b2b268beffbf8.eot");
	    src: url("https://db.onlinewebfonts.com/t/70f9644542515286487b2b268beffbf8.eot?#iefix")format("embedded-opentype"),
	    url("https://db.onlinewebfonts.com/t/70f9644542515286487b2b268beffbf8.woff2")format("woff2"),
	    url("https://db.onlinewebfonts.com/t/70f9644542515286487b2b268beffbf8.woff")format("woff"),
	    url("https://db.onlinewebfonts.com/t/70f9644542515286487b2b268beffbf8.ttf")format("truetype"),
	    url("https://db.onlinewebfonts.com/t/70f9644542515286487b2b268beffbf8.svg#Comfortaa Bold V2")format("svg");
	}
    body {
      background: radial-gradient(circle, rgba(238,174,202,1) 0%, rgba(148,187,233,1) 100%);
      min-height: 100vh;
    }

    .container {
      width: 95vw;
      min-height: 100vh;
      padding: 20px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      text-align: center;
    }

    .stts {
      font-family: "Comfortaa Bold V2";
      text-shadow: 2px 2px 4px rgba(0,0,0,0.1);
    }

    .sttts {
      color: #FF7452;
      transition: color 0.3s ease;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      transition: filter 0.3s ease;
    }

    a:hover {
      filter: brightness(1.5);
    }

    @media (max-width: 768px) {
      .container h1 { font-size: 2rem; }
      .stts[style*="300px"] { font-size: 15vw !important; }
    }

    #show {
      min-height: 2em;
      margin: 15px 0;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>
      <span class="sttts" style="font-size:320%">afrp</span>
      <span class="stts" style="font-size:320%;color:#1cc88a">.net</span>
    </h1>
    <span class="stts" style="font-size:300px"><b>4 0 4</b></span>
	<br>
    <h1 class="stts">Ah! I seem to be lost.</h1>
	<br>
    <span class="stts" id="show"></span>
	<br>
    <h4 class="stts">
      Powered By <a href="https://github.com/fatedier/frp">Frp</a> 
      & Credits to <a href="https://github.com/KuwiNet/frp-onekey">KuwiNet</a>
    </h4>
  </div>
</body>
</html>
